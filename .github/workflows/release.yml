# Builds the Android APK and publishes it as a GitHub Release.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The landing page button points to
#   https://github.com/RidhaHleli/mihrab_tv/releases/latest/download/mihrab.apk
# so every new release becomes the site's download automatically.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds the APK and keeps it as a workflow artifact only

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Optional release key. Without these secrets the APK is signed with the
      # debug key (installable, but a later build signed with a real key
      # cannot update it). See README, "Publier une version".
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "Signing with the release key"
          else
            echo "No release key: using the debug key"
          fi

      - name: Build APK
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="0.0.0-dev"; fi
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$NAME" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk mihrab.apk
          sha256sum mihrab.apk > mihrab.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mihrab-apk
          path: |
            mihrab.apk
            mihrab.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mihrab.apk
            mihrab.apk.sha256
          generate_release_notes: true
