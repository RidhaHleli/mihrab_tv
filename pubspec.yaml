
name: mihrab_tv
description: "MIHRAB - Offline-first prayer times and mosque display for Android TV."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  wakelock_plus: ^1.4.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/prayer_times.json
    - assets/audio/
    - assets/data/tunisia_locations.json
