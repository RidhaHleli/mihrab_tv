
name: mihrab_tv
description: "MIHRAB - Offline-first prayer times and mosque display for Android TV."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  wakelock_plus: ^1.4.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  http: ^1.6.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

  assets:
    - assets/data/prayer_times.json
    - assets/audio/
    - assets/data/tunisia_locations.json
    - assets/data/world_cities.json
